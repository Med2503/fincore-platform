spring:
  application:
    name: execution-service

  datasource:
    url: ${EXECUTION_DB_URL:jdbc:postgresql://localhost:5432/execution_db}
    username: ${EXECUTION_DB_USERNAME:bank_user}
    password: ${EXECUTION_DB_PASSWORD:fincore}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    function:
      definition: ""
    stream:
      default-binder: kafka
      bindings: { }
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    org.fincore.execution: INFO
    org.hibernate.SQL: INFO
