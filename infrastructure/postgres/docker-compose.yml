services:

  postgres:
    image: postgres:16
    container_name: fincore-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
      POSTGRES_DB: identity_db

    ports:
      - "5432:5432"

    volumes:
      - fincore_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fincore_postgres_data: